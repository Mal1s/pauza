[project]
name = "pauza-telegram-bot"
version = "1.0.0"
description = "Telegram intake bot for PAUZA football team"
requires-python = ">=3.11,<3.12"
dependencies = [
    "aiogram>=3.33,<4",
    "aiosqlite>=0.22,<1",
]

[tool.uv]
package = false

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"
